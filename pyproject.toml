[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-sync"
version = "0.4.0"
description = "Turn company chat attendance notes into attendance-system requests, with human approval for every write"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["attendance", "mattermost", "automation", "playwright", "time-tracking"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27,<1",
    "jdatetime>=5,<6",
    # Used only by the Kasra browser adapter; the preview stage needs neither.
    "playwright>=1.40",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
attendance-sync = "attendance_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
